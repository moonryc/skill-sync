<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">skill-sync unmanaged skill inventory</title>
  <desc id="desc">The skill-sync terminal interface listing local Codex and Claude skills that can be added to the Git library.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#080d18"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="#07111f"/>
  <circle cx="1080" cy="50" r="260" fill="#2dd4bf" opacity="0.08"/>
  <rect x="70" y="54" width="1060" height="572" rx="22" fill="url(#screen)" stroke="#334155" filter="url(#shadow)"/>
  <path d="M70 112h1060" stroke="#334155"/>
  <circle cx="108" cy="83" r="8" fill="#fb7185"/>
  <circle cx="136" cy="83" r="8" fill="#fbbf24"/>
  <circle cx="164" cy="83" r="8" fill="#34d399"/>
  <text x="600" y="90" fill="#94a3b8" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="18" text-anchor="middle">skill-sync tui</text>
  <g font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="20">
    <rect x="104" y="140" width="992" height="52" rx="10" fill="#0f172a" stroke="#d946ef"/>
    <text x="126" y="173" fill="#f0abfc" font-weight="700">✦ skill-sync command center · project scope</text>
    <text x="104" y="238" fill="#f8fafc" font-weight="700">Unmanaged skill inventory</text>
    <text x="104" y="287" fill="#f0abfc">❯ codex · openspec-propose <tspan fill="#fbbf24">[unmanaged]</tspan> · [actionable]</text>
    <text x="132" y="318" fill="#94a3b8">/Users/you/project/.codex/skills/openspec-propose</text>
    <text x="104" y="367" fill="#cbd5e1">  codex · review-pr <tspan fill="#fbbf24">[unmanaged]</tspan> · [actionable]</text>
    <text x="132" y="398" fill="#94a3b8">/Users/you/project/.codex/skills/review-pr</text>
    <text x="104" y="447" fill="#cbd5e1">  claude · release-notes <tspan fill="#fbbf24">[unmanaged]</tspan> · [actionable]</text>
    <text x="132" y="478" fill="#94a3b8">/Users/you/project/.claude/skills/release-notes</text>
    <text x="104" y="538" fill="#94a3b8">↑↓ move · Enter/a add to library · d adopt existing · r refresh · Esc back</text>
    <text x="104" y="583" fill="#64748b">Started from skill-sync tui</text>
  </g>
</svg>
