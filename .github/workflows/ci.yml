name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  completion-shells:
    name: Validate generated shell completions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install --yes fish zsh
      - run: npm ci
      - run: npx vitest run --config libs/cli/vitest.config.ts tests/unit/completion.test.ts
        env:
          SKILL_SYNC_REQUIRE_COMPLETION_SHELLS: '1'

  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  package:
    name: Inspect publish artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm pack ./dist/libs/cli --json > npm-pack.json
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: |
            *.tgz
            npm-pack.json
          if-no-files-found: error
